apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dns-dashboard
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: dns-dashboard.my.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dns-dashboard
                port:
                  number: 80
