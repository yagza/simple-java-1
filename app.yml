apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-argo-application
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/yagza/simple-java-1.git
    targetRevision: HEAD
    path: blah-argo
  destination: 
    server: https://kubernetes.default.svc
    namespace: argo-first-app

  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
