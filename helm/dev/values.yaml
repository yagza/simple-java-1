nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: your-registry/dns-dashboard
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  containerPort: 8080
  name: http

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: dns-dashboard.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null

nodeSelector: {}
tolerations: []
affinity: {}

revisionHistoryLimit: 5
terminationGracePeriodSeconds: 30

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 25%
    maxSurge: 25%

env:
  - name: APP_TITLE
    value: "DNS Dashboard in Kubernetes"
  - name: SERVER_PORT
    value: "8080"
  - name: APP_HOSTS_0
    value: "google.com"
  - name: APP_HOSTS_1
    value: "github.com"
  - name: APP_HOSTS_2
    value: "kubernetes.io"
  - name: APP_HOSTS_3
    value: "spring.io"
  - name: APP_HOSTS_4
    value: "example.org"

probes:
  readiness:
    enabled: true
    path: /
    port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    successThreshold: 1
    failureThreshold: 3
  liveness:
    enabled: true
    path: /
    port: http
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 2
    successThreshold: 1
    failureThreshold: 3
  startup:
    enabled: false
    path: /
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    successThreshold: 1
    failureThreshold: 30
